name: IslamicCompanion
options:
  bundleIdPrefix: com.deen
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: false
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CURRENT_PROJECT_VERSION: "1.0.0"
    MARKETING_VERSION: "1.0.0"
    DEAD_CODE_STRIPPING: YES

targets:
  IslamicCompanion:
    type: application
    platform: iOS
    sources:
      - path: IslamicCompanion
        excludes:
          - Tests/**
    info:
      path: IslamicCompanion/App/Info.plist
      properties:
        CFBundleDisplayName: "Deen"
        CFBundleIdentifier: "com.deen.companion"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: "LaunchScreenBackground"
        UIBackgroundModes:
          - audio
          - fetch
        NSLocationWhenInUseUsageDescription: "Deen uses your location to calculate accurate astronomical prayer times and the precise Qibla direction towards the Kaaba on your device."
        NSMicrophoneUsageDescription: "Deen does not use your microphone."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: IslamicCompanion/App/IslamicCompanion.entitlements

  IslamicCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IslamicCompanion/Tests
    dependencies:
      - target: IslamicCompanion
