name: Build & Release Islamic Companion iOS (IPA & Web)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration (Release or Debug)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-build"
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build iOS IPA & Create Release
    runs-on: macos-14  # Apple Silicon runner (M1/M2) with latest Xcode

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Setup Build Directories
        run: |
          mkdir -p build/derivedData
          mkdir -p build/archive
          mkdir -p build/artifacts

      - name: Generate Xcode Project via XcodeGen
        run: |
          echo "Installing XcodeGen..."
          brew install xcodegen
          echo "Generating Xcode project..."
          xcodegen generate

      - name: Build and Archive (Clean Architecture)
        run: |
          CONFIG="${{ github.event.inputs.build_configuration || 'Release' }}"
          echo "Building configuration: $CONFIG"
          
          xcodebuild archive \
            -project IslamicCompanion.xcodeproj \
            -scheme IslamicCompanion \
            -configuration "$CONFIG" \
            -destination "generic/platform=iOS" \
            -archivePath "build/archive/IslamicCompanion.xcarchive" \
            -derivedDataPath "build/derivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into Sideloadable IPA
        run: |
          if [ -d "build/archive/IslamicCompanion.xcarchive/Products/Applications" ]; then
            mkdir -p build/ipa_payload/Payload
            cp -r build/archive/IslamicCompanion.xcarchive/Products/Applications/*.app build/ipa_payload/Payload/
            
            echo "Applying Ad-Hoc signature to app bundle..."
            codesign -s - --force --deep build/ipa_payload/Payload/*.app
            
            cd build/ipa_payload
            zip -r -q ../artifacts/IslamicCompanion.ipa Payload
            cd ../..
            echo "Successfully packaged IslamicCompanion.ipa"
          else
            echo "Error: Applications directory not found in xcarchive"
            exit 1
          fi

      - name: Upload IPA Artifact to GitHub Run
        uses: actions/upload-artifact@v4
        with:
          name: IslamicCompanion-iOS-IPA
          path: build/artifacts/IslamicCompanion.ipa
          retention-days: 14

      - name: Create or Update GitHub Release with IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0"
          echo "Creating or updating GitHub Release: $TAG_NAME"
          # Delete existing release/tag if already present to update cleanly
          gh release delete "$TAG_NAME" --yes || true
          git tag -d "$TAG_NAME" 2>/dev/null || true
          git push origin :refs/tags/"$TAG_NAME" 2>/dev/null || true
          
          gh release create "$TAG_NAME" \
            build/artifacts/IslamicCompanion.ipa \
            --title "Deen iOS v1.0.0 (Enterprise Release)" \
            --notes "### 📱 Deen — Islamic Daily Companion for iPhone
            - **Platform:** iOS 17.0+ / iOS 18+
            - **Architecture:** Swift 6.4 Strict Concurrency, Pure Astronomical Math, AVFoundation Background Audio.
            - **Direct Download:** [IslamicCompanion.ipa](https://github.com/${{ github.repository }}/releases/download/v1.0.0/IslamicCompanion.ipa)
            - **Installation:** Sideloadable directly via SideStore, AltStore, Sideloadly, or Scarlet without a paid developer account." \
            --latest

      - name: Build Summary
        run: |
          echo "### 📱 iOS Build & Release Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **Release:** [Deen iOS v1.0.0](https://github.com/${{ github.repository }}/releases/tag/v1.0.0)" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct IPA Download:** [IslamicCompanion.ipa](https://github.com/${{ github.repository }}/releases/download/v1.0.0/IslamicCompanion.ipa)" >> $GITHUB_STEP_SUMMARY

  deploy-pages:
    name: Deploy Web Showcase to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-and-release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
